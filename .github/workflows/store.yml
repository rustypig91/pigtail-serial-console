name: Microsoft Store MSIX

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'scripts/build-msix.ps1'
      - '.github/workflows/store.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: store-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target/store
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/store'
          key: microsoft-store
      - name: Test Store edition
        run: cargo test -p pigtail --features microsoft-store --locked
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = (($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'pigtail').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match workspace version $version" }
      - name: Build unsigned MSIX for Partner Center
        shell: pwsh
        run: ./scripts/build-msix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: pigtail-store-msix-${{ github.run_id }}
          if-no-files-found: error
          path: target/release-assets/store/*.msix
