name: "release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read workspace version
        id: version
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Workspace version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches workspace version
        # Only meaningful on tag builds; manual/branch runs have no version to check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Workspace version: ${{ steps.version.outputs.version }}"
          echo "Tag version:       $TAG_VERSION"
          if [ "${{ steps.version.outputs.version }}" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match workspace version '${{ steps.version.outputs.version }}'"
            exit 1
          fi

  release:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   target: 'aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          #   target: 'x86_64-apple-darwin'
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          # - platform: 'ubuntu-22.04-arm' # Only available in public repos.
          #   target: 'aarch64-unknown-linux-gnu'
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu') # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p pigtail --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="pigtail-v${VERSION}-${{ matrix.target }}"
          mkdir "$OUT"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$BIN_DIR/pigtail.exe" "$OUT/"
          else
            cp "$BIN_DIR/pigtail" "$OUT/"
          fi
          cp README.md LICENSE "$OUT/"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            7z a "$OUT.zip" "$OUT" >/dev/null
            echo "ASSET=$OUT.zip" >> "$GITHUB_ENV"
          else
            tar czf "$OUT.tar.gz" "$OUT"
            echo "ASSET=$OUT.tar.gz" >> "$GITHUB_ENV"
          fi

      # --- Windows installer -------------------------------------------------
      # WiX v3 is not guaranteed to be present on the runner image, so fetch a
      # pinned copy and drive candle/light directly. The same crates/pigtail/
      # wix/main.wxs also works locally via `cargo wix -p pigtail`.
      - name: Install WiX toolset (windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfLo wix.zip \
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          7z x wix.zip -owix-bin >/dev/null
          echo "$PWD/wix-bin" >> "$GITHUB_PATH"

      - name: Build MSI installer (windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          MSI="pigtail-v${VERSION}-${{ matrix.target }}.msi"
          # candle.exe is a native tool, so it needs Windows paths — bash's $PWD
          # is an MSYS path here. GITHUB_WORKSPACE is already Windows-style.
          WS="$GITHUB_WORKSPACE"
          candle.exe \
            -nologo -arch x64 \
            -dVersion="$VERSION" \
            -dPlatform=x64 \
            -dCargoTargetBinDir="$WS/target/${{ matrix.target }}/release" \
            -out obj/ \
            "$WS/crates/pigtail/wix/main.wxs"
          light.exe \
            -nologo \
            -ext WixUIExtension \
            -cultures:en-us \
            -out "$MSI" \
            obj/main.wixobj
          echo "MSI_ASSET=$MSI" >> "$GITHUB_ENV"

      # --- Linux packages ----------------------------------------------------
      - name: Build .deb package (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # --no-build reuses the release binary built above. cargo-deb prints
          # the path of the package it wrote as its last line of stdout.
          DEB="$(cargo deb -p pigtail --target ${{ matrix.target }} --no-build | tail -n1)"
          echo "Built $DEB"
          echo "DEB_ASSET=$DEB" >> "$GITHUB_ENV"

      - name: Build AppImage (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          bash crates/pigtail/packaging/linux/build-appimage.sh \
            "target/${{ matrix.target }}/release/pigtail" "$VERSION" .
          echo "APPIMAGE_ASSET=pigtail-v${VERSION}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Pigtail v${{ env.VERSION }}"
          body: "See the assets to download this version."
          # Publish the release (with its assets) when building from a release
          # tag; keep branch/manual builds as drafts so they don't publish.
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
          # Unset variables expand to nothing, so each platform uploads only the
          # assets it actually produced.
          files: |
            ${{ env.ASSET }}
            ${{ env.MSI_ASSET }}
            ${{ env.DEB_ASSET }}
            ${{ env.APPIMAGE_ASSET }}
