[package]
name = "serialcore"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic core for Pigtail: sources, framing, storage, filtering, extraction."

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.9.0"
smallvec = { version = "1.15.2", features = ["serde"] }
thiserror = "2.0.19"
toml = "1.0.7"
tracing = "0.1.44"
ureq = "3.2.1"

[dev-dependencies]
proptest = "1.8.0"
