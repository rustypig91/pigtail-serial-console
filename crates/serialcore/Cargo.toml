[package]
name = "serialcore"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic core for Rusty's Pigtail: sources, framing, storage, filtering, extraction."

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
memchr = "2.8.3"
regex = "1.13.1"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serialport = "4.10.1"
sha2 = "0.11.0"
smallvec = { version = "1.16.3", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
ureq = "3.4.2"

[dev-dependencies]
proptest = "1.12.0"
