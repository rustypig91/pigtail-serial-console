[package]
name = "pigtail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop serial terminal for embedded firmware development."

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = "0.30.0"
egui = "0.30"
egui_plot = "0.30.0"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serialcore = { path = "../serialcore" }
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
